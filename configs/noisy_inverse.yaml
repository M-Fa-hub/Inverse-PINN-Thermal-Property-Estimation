experiment:
  name: noisy_inverse
  seed: 42
  output_dir: outputs
  use_mlflow: false

problem:
  dimension: 2
  transient: true

geometry:
  length_x: 1.0
  length_y: 1.0
  final_time: 100.0

physics:
  true_alpha: 1.0e-5
  heat_source: 0.0
  conductivity: 1.0

boundary:
  type: dirichlet_homogeneous

initial:
  type: modal
  value: 1.0

scaling:
  temperature_scale: 1.0
  normalize_inputs: true

inverse:
  parameter: alpha
  initial_guess: 2.0e-5
  transform: softplus

network:
  hidden_layers: [64, 64, 64, 64]
  activation: tanh
  fourier_features: false
  fourier_scale: 10.0
  fourier_features_dim: 64
  initialization: xavier

sampling:
  n_interior: 8000
  n_boundary: 2000
  n_initial: 1500
  method: sobol

sensors:
  n_sensors: 12
  n_time_samples: 40
  placement: grid
  random_seed: 42

measurement:
  noise_std: 0.02  # relative to temperature scale ~1

reference:
  nx: 41
  ny: 41
  nt: 201
  scheme: explicit

training:
  adam_epochs: 5000
  learning_rate: 0.001
  lbfgs_enabled: true
  lbfgs_max_iter: 500
  batch_interior: null
  scheduler: cosine
  early_stopping_patience: 1500
  grad_clip: 1.0
  checkpoint_every: 500
  resume_from_checkpoint: null
  print_every: 200
  device: cpu

loss:
  lambda_pde: 1.0
  lambda_bc: 10.0
  lambda_ic: 10.0
  lambda_data: 100.0
  lambda_reg: 0.0

adaptive:
  enabled: false
  refine_every: 1000
  n_new_points: 500
  top_fraction: 0.2

uncertainty:
  method: ensemble
  n_members: 3
  enabled: false

evaluation:
  grid_nx: 41
  grid_ny: 41
  grid_nt: 21
